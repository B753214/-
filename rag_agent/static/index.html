<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas · 知识问答</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#1f2937;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}header{height:68px;background:white;border-bottom:1px solid #e5e9ef;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 950px)/2))}header b{font-size:19px;letter-spacing:.4px}header b span{color:#2869e6}header small{color:#7b8798}.wrap{max-width:950px;margin:0 auto;padding:54px 24px 80px}.eyebrow{font-size:11px;color:#2869e6;letter-spacing:2px;font-weight:700}h1{font-size:38px;letter-spacing:-1.5px;margin:15px 0}p{line-height:1.7}.intro{color:#718096;margin-bottom:36px}.card{background:white;border:1px solid #e6eaf0;border-radius:16px;box-shadow:0 12px 40px #16335a0b;padding:25px}label{display:block;font-weight:600;margin-bottom:12px}textarea{width:100%;border:1px solid #dce2eb;border-radius:10px;padding:15px;font:15px/1.6 inherit;min-height:145px;resize:vertical;outline-color:#2869e6}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}button,.file-label{font:inherit;border:1px solid #d9e1ec;background:white;border-radius:9px;padding:12px 16px;cursor:pointer;color:#344054}.primary{background:#2869e6;border-color:#2869e6;color:white;margin-left:auto;font-weight:600}.primary:disabled{opacity:.5;cursor:wait}.file-label{font-weight:400;margin:0}.file-label input{display:none}button:hover,.file-label:hover{border-color:#2869e6}.hint{font-size:12px;color:#8190a3;margin-top:14px}.status{margin-top:16px;color:#64748b;font-size:13px;min-height:20px}.error{color:#c44747}.result{margin-top:22px;display:none}.result.visible{display:block}.answer{white-space:pre-wrap;line-height:1.9;font-size:15px}.meta{display:flex;gap:12px;align-items:center;color:#667085;font-size:12px;margin:20px 0;border-top:1px solid #edf0f4;padding-top:18px}.pill{background:#ecf2ff;color:#2869e6;padding:5px 9px;border-radius:99px}.sources{margin:0;padding-left:22px;line-height:2;color:#526273;font-size:13px}.sources a{color:#2869e6;overflow-wrap:anywhere}.foot{margin-top:32px;font-size:12px;color:#9aa6b7}@media(max-width:640px){.wrap{padding:36px 17px}header{padding:0 17px}header small{display:none}h1{font-size:29px}.card{padding:18px}.primary{margin-left:0;width:100%}.actions{gap:8px}.actions button,.actions .file-label{font-size:13px}.meta{flex-wrap:wrap}}
</style></head><body><header><b><span>◈</span> Atlas 知识问答</b><small>Notion · PDF · Hybrid Search</small></header><main class="wrap"><div class="eyebrow">ASK YOUR KNOWLEDGE</div><h1>有问题，直接问。</h1><p class="intro">支持中文与 English 问题，也可以录音提问。先判断是否需要查资料，再选择知识库、指定链接或网络；稳定概念可直接回答。</p><section class="card"><label for="question">你的问题 / Your question</label><textarea id="question" placeholder="例如：这份文档的核心结论是什么？&#10;Or: What are the key findings?"></textarea><div class="actions"><button id="record" type="button">🎙 开始录音</button><label class="file-label">📎 选择音频<input id="audio" type="file" accept=".webm,.mp3,.wav,.ogg"></label><button class="primary" id="ask" type="button">开始提问 →</button></div><p class="hint">音频转写后可修改识别文字，再点击提问。输出仅为文字。</p><div id="status" class="status" role="status"></div></section><section id="result" class="card result" aria-live="polite"><div class="eyebrow">ANSWER</div><div id="answer" class="answer"></div><div class="meta"><span id="mode" class="pill"></span><span id="route"></span><span id="timing"></span></div><div id="sources-heading" class="eyebrow">SOURCES</div><ol id="sources" class="sources"></ol></section><div class="foot">知识库回答由 AI 生成，请结合引用原文核对重要信息。</div></main><script>
const q=document.querySelector('#question'),s=document.querySelector('#status'),result=document.querySelector('#result'),answer=document.querySelector('#answer'),sources=document.querySelector('#sources'),ask=document.querySelector('#ask'),record=document.querySelector('#record');let recorder,chunks=[];
const showError=e=>{s.textContent=e.message||String(e);s.className='status error'};
async function post(url,body,isJSON=false){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),45000);try{const response=await fetch(url,{method:'POST',body:isJSON?JSON.stringify(body):body,headers:isJSON?{'Content-Type':'application/json'}:{},signal:controller.signal});const data=await response.json();if(!response.ok)throw Error(data.detail||'请求失败');return data}catch(error){if(error.name==='AbortError')throw Error('请求超时，请稍后重试');throw error}finally{clearTimeout(timeout)}}
async function askStream(question,onDelta){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),90000);try{const response=await fetch('/api/ask/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question}),signal:controller.signal});if(!response.ok)throw Error('请求失败');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const chunk=await reader.read();if(chunk.done)break;buffer+=decoder.decode(chunk.value,{stream:true});let end;while((end=buffer.indexOf('\n'))>=0){const line=buffer.slice(0,end);buffer=buffer.slice(end+1);if(!line.trim())continue;const event=JSON.parse(line);if(event.type==='delta')onDelta(event.text);else if(event.type==='error')throw Error(event.message||'请求失败');else if(event.type==='done')return event.result}}throw Error('连接中断，请重试')}catch(error){if(error.name==='AbortError')throw Error('请求超时，请稍后重试');throw error}finally{clearTimeout(timeout)}}
async function transcribe(file){s.className='status';s.textContent='正在转写音频…';const data=new FormData();data.append('audio',file);try{q.value=(await post('/api/transcribe',data)).text;s.textContent='转写完成。请确认文字，然后点击开始检索。'}catch(e){showError(e)}}
document.querySelector('#audio').onchange=e=>{const file=e.target.files[0];if(file)transcribe(file)};
record.onclick=async()=>{if(recorder&&recorder.state==='recording'){recorder.stop();record.textContent='🎙 开始录音';return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());transcribe(new File(chunks,'question.webm',{type:'audio/webm'}))};recorder.start();record.textContent='⏹ 停止录音';s.textContent='录音中…'}catch(e){showError(e)}};
ask.onclick=async()=>{if(!q.value.trim())return showError(new Error('请先输入问题或录制音频'));ask.disabled=true;result.classList.remove('visible');s.className='status';s.textContent='正在处理问题…';try{answer.textContent='';const data=await askStream(q.value,token=>{answer.textContent+=token;result.classList.add('visible');s.textContent='正在生成回答…'});answer.textContent=data.answer;document.querySelector('#mode').textContent=({'web':'网络搜索 / Web','web_url':'指定网页 / Supplied URL','notion_url':'Notion 页面 / Notion page','model':'模型直接回答 / Model','conversation':'直接回答 / Direct answer','unavailable':'搜索未配置 / Search unavailable','none':'未找到依据 / No evidence','knowledge_base':'知识库 / Knowledge base'}[data.source_mode]||'知识库 / Knowledge base');document.querySelector('#route').textContent=({'stable_concept':'稳定概念','time_sensitive':'时效性','high_stakes':'高风险','internal_data':'内部资料','supplied_url':'指定链接','uncertain':'需核实','knowledge_base_low_quality':'知识库证据不足'}[data.route_reason]||'');document.querySelector('#timing').textContent=`判断 ${data.route_ms||0} ms · 检索 ${data.retrieval_ms} ms · 总计 ${data.total_ms||0} ms`;sources.replaceChildren();document.querySelector('#sources-heading').hidden=!data.sources.length;for(const [i,source] of data.sources.entries()){const li=document.createElement('li');const text=`[${i+1}] ${source.title} — ${source.source}`;if(/^https?:\/\//.test(source.source)){const a=document.createElement('a');a.href=source.source;a.target='_blank';a.rel='noopener noreferrer';a.textContent=text;li.append(a)}else li.textContent=text;sources.append(li)}result.classList.add('visible');s.textContent=''}catch(e){showError(e)}finally{ask.disabled=false}};
</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atlas · 通话辅助</title>
  <link rel="stylesheet" href="/static/live.css">
  <script src="/static/live.js" defer></script>
</head>
<body>
  <main class="page">
    <nav><a href="/">← 返回知识问答</a><span>ATLAS / LIVE INTERVIEW</span></nav>
    <div id="panel-mount">
      <section id="live-panel" class="panel">
        <header>
          <div><div class="eyebrow">LIVE INTERVIEW</div><h1>通话辅助</h1></div>
          <span id="session-state" class="badge">未开始</span>
        </header>
        <p class="intro">同时记录你的麦克风和电脑播放的面试官声音，完整转写保存在本次会话中。</p>
        <div class="controls">
          <button id="start" class="primary">开始会话</button>
          <button id="end" disabled>结束会话</button>
          <button id="float" disabled>悬浮小窗</button>
          <button id="native-float" title="Windows 原生浮窗，点击时不激活窗口">原生浮窗</button>
          <button id="export" disabled>导出记录</button>
        </div>
        <details id="ai-options" class="ai-options"><summary title="更多设置">更多设置</summary>
          <label class="switch-row" for="ai-switch"><span><strong>AI 回答</strong><small>开启后只回答新听到的面试官问题；“回答与评价”开启时也会回答</small></span><input id="ai-switch" type="checkbox" disabled><span class="switch" aria-hidden="true"></span></label>
          <label class="switch-row" for="assess-switch"><span><strong>回答与评价</strong><small>回答新听到的面试官问题，并评价、补充你随后说出的回答</small></span><input id="assess-switch" type="checkbox" disabled><span class="switch" aria-hidden="true"></span></label>
        </details>
        <label class="switch-row bleed-row" for="bleed-switch"><span><strong>防串音</strong><small>面试官说话时暂停麦克风转写；双方同时说话时可能漏掉你的声音</small></span><input id="bleed-switch" type="checkbox" checked><span class="switch" aria-hidden="true"></span></label>
        <div id="status" class="status" role="status">点击“开始会话”，共享会议音频并允许麦克风。使用桌面版 Chrome 或 Edge。</div>
        <div class="previews"><div><b>面试官 · 电脑声音</b><p id="interviewer-preview">等待语音…</p></div><div><b>我 · 麦克风</b><p id="me-preview">等待语音…</p></div></div>
        <div class="log-header"><h2>本次记录</h2><span id="count">0 条</span></div>
        <div id="log" class="log" aria-live="polite"><p class="empty">会话记录会显示在这里。</p></div>
      </section>
    </div>
    <p class="note">优先使用耳机，避免扬声器声音进入麦克风。请选择会议窗口或整个屏幕，并在共享对话框中勾选音频。浏览器只将文字保存在当前标签页的会话中；新会话会覆盖旧记录。</p>
  </main>
</body>
</html>
